<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarjetas Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <!-- Primera tarjeta -->
            <div class="col-md-6">

                <div class="card border border-dark border-3">

                    <div class="row g-0">

                        <!-- Mitad azul -->
                        <div class="col-6 bg-primary text-white">

                            <div class="card-body">

                                <h3>
                                    Curso HTML
                                </h3>

                                <p>
                                    Aprende las bases del desarrollo web.
                                </p>

                            </div>

                        </div>

                        <!-- Mitad blanca -->
                        <div class="col-6 bg-white text-dark">

                            <div class="card-body">

                                <h3>
                                    Desarrollo Web
                                </h3>

                                <p>
                                    Crea tus propias páginas utilizando HTML.
                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Segunda tarjeta -->
            <div class="col-md-6">

                <div class="card bg-success text-white border border-dark border-3">

                    <div class="card-body">

                        <h3>
                            Curso CSS
                        </h3>

                        <p>
                            Aprende a darle estilo y diseño a tus páginas web.
                        </p>

                        <button class="btn btn-light">
                            Ver curso
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
